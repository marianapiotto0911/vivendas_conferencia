<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivendas de Barão — Painel de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #263934;
    --bg-panel: #34493F;
    --bg-panel-2: #3E5548;
    --line: rgba(243,238,231,0.14);
    --line-strong: rgba(243,238,231,0.28);
    --text: #F4EFE7;
    --text-dim: #B9C2BA;
    --accent: #C9987A;
    --accent-light: #E3C1A4;
    --s-construcao: #C9987A;
    --s-eletrica: #C0655A;
    --s-hidraulica: #6E9FBD;
    --s-gas: #D2B23C;
    --s-arcond: #7FAF9C;
    --st-empty: transparent;
    --st-half: #D9A441;
    --st-full: #6FA968;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  .font-display{font-family:'Fraunces',serif;}

  /* ---------- HEADER ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background: rgba(38,57,52,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 22px;
    gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:44px; width:auto; display:block; border-radius:4px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text .t1{font-family:'Fraunces',serif; font-size:17px; letter-spacing:.02em;}
  .brand-text .t2{font-size:11px; color:var(--text-dim); letter-spacing:.04em;}
  nav.site{display:flex; align-items:center; gap:18px; font-size:14px;}
  nav.site .home-link{padding:8px 14px; border:1px solid var(--line-strong); border-radius:20px; transition:.15s; color:var(--text); font-family:inherit; font-size:14px;}
  nav.site .home-link:hover{border-color:var(--accent); color:var(--accent-light);}

  .checklist-menu{position:relative;}
  .checklist-btn{padding:8px 14px; border:1px solid var(--line-strong); border-radius:20px; background:none; color:var(--text); font-size:14px;}
  .checklist-btn:hover{border-color:var(--accent); color:var(--accent-light);}
  .checklist-panel{
    display:none; position:absolute; right:0; top:calc(100% + 10px);
    width:340px; max-height:70vh; overflow-y:auto;
    background:var(--bg-panel); border:1px solid var(--line-strong); border-radius:var(--radius);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    padding:10px;
  }
  .checklist-menu:hover .checklist-panel, .checklist-menu.open .checklist-panel{display:block;}
  .checklist-panel a{
    display:flex; align-items:center; gap:9px;
    padding:7px 8px; border-radius:6px; font-size:13px;
  }
  .checklist-panel a:hover{background:rgba(255,255,255,0.06);}
  .checklist-panel .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .checklist-panel .num{color:var(--text-dim); font-variant-numeric:tabular-nums; width:22px; flex:none;}

  main{max-width:1180px; margin:0 auto; padding:28px 22px 80px;}

  /* ---------- HOME ---------- */
  .home-head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:18px; margin-bottom:26px;}
  .home-head h1{font-family:'Fraunces',serif; font-weight:500; font-size:30px; margin:0 0 6px;}
  .home-head p{margin:0; color:var(--text-dim); font-size:14px;}
  .overall-stat{
    text-align:right;
  }
  .overall-stat .num{font-family:'Fraunces',serif; font-size:38px; color:var(--accent-light); line-height:1;}
  .overall-stat .lbl{font-size:12px; color:var(--text-dim); letter-spacing:.03em;}

  .rows-wrap{display:flex; flex-direction:column; gap:18px;}
  .block-row{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .block-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 18px;
  }
  .block-card .bhead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .block-card .bhead h3{font-family:'Fraunces',serif; font-weight:500; font-size:17px; margin:0; letter-spacing:.02em;}
  .block-card .bhead .bpct{font-size:13px; color:var(--accent-light); font-variant-numeric:tabular-nums;}
  .house-grid{display:grid; grid-template-columns:repeat(9,1fr); gap:7px;}
  .house-cell{
    position:relative;
    aspect-ratio:1/1;
    border:1px solid var(--line-strong);
    border-radius:7px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.03);
    transition:.15s;
  }
  .house-cell:hover{border-color:var(--accent); background:rgba(201,152,122,0.12);}
  .house-cell .hn{font-size:13px; font-weight:600;}
  .house-cell .hp{font-size:9px; color:var(--text-dim); font-variant-numeric:tabular-nums; margin-top:1px;}
  .house-cell .star{position:absolute; top:2px; right:3px; font-size:8px; color:var(--accent);}
  .house-cell .ring{
    position:absolute; inset:0; border-radius:7px; pointer-events:none;
    border:2px solid transparent;
  }

  .legend-row{display:flex; gap:18px; flex-wrap:wrap; margin-top:20px; font-size:12px; color:var(--text-dim); align-items:center;}
  .legend-row .item{display:flex; align-items:center; gap:6px;}
  .legend-row .sw{width:10px; height:10px; border-radius:3px; display:inline-block;}

  /* ---------- BREADCRUMB ---------- */
  .crumb{font-size:13px; color:var(--text-dim); margin-bottom:18px; display:flex; gap:8px; align-items:center;}
  .crumb a:hover{color:var(--accent-light);}

  /* ---------- CASA PAGE ---------- */
  .casa-head{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:22px;
  }
  .casa-head .title-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:16px;}
  .casa-head h1{font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:0; display:flex; align-items:center; gap:10px;}
  .casa-head h1 .star{color:var(--accent); font-size:18px;}
  .casa-head .total-pct{font-family:'Fraunces',serif; font-size:34px; color:var(--accent-light);}
  .sector-bars{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
  .sector-bar{display:flex; flex-direction:column; gap:6px;}
  .sector-bar .lbl{font-size:11px; color:var(--text-dim); display:flex; justify-content:space-between;}
  .sector-bar .track{height:6px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden;}
  .sector-bar .fill{height:100%; border-radius:4px; transition:width .25s;}

  .item-list{display:flex; flex-direction:column; gap:6px;}
  .item-row{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 14px;
  }
  .item-row .idot{width:9px; height:9px; border-radius:50%; flex:none;}
  .item-row .iname{flex:1; font-size:13.5px;}
  .item-row .iname:hover{color:var(--accent-light);}
  .item-row .iweight{font-size:11px; color:var(--text-dim); width:44px; text-align:right; flex:none; font-variant-numeric:tabular-nums;}
  .checkbox3{
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    flex:none; cursor:pointer; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  body.readonly .checkbox3, body.readonly .item-cell{ cursor:default; }
  body.readonly .checkbox3:hover .box-inner{ border-color:var(--line-strong); }
  body.readonly .item-cell:hover{ border-color:var(--line-strong); }
  .checkbox3 .box-inner{
    width:24px; height:24px; border-radius:5px; border:1.5px solid var(--line-strong);
    transition:.12s;
  }
  .checkbox3:hover .box-inner{border-color:var(--accent);}
  .checkbox3[data-v="50"] .box-inner{background:var(--st-half); border-color:var(--st-half);}
  .checkbox3[data-v="100"] .box-inner{background:var(--st-full); border-color:var(--st-full);}

  /* ---------- ITEM PAGE ---------- */
  .item-head{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 24px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
  }
  .item-head .left h1{font-family:'Fraunces',serif; font-weight:500; font-size:23px; margin:0 0 6px;}
  .item-head .left .sub{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
  .item-head .left .sub .idot{width:9px;height:9px;border-radius:50%;}
  .item-head .total-pct{font-family:'Fraunces',serif; font-size:34px; color:var(--accent-light);}

  .item-cell{
    position:relative; aspect-ratio:1/1; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line-strong);
    font-size:13px; font-weight:600;
    background:rgba(255,255,255,0.03);
    transition:.12s;
  }
  .item-cell:hover{border-color:var(--accent);}
  .item-cell[data-v="50"]{background:var(--st-half); border-color:var(--st-half); color:#3a2b0a;}
  .item-cell[data-v="100"]{background:var(--st-full); border-color:var(--st-full); color:#12321a;}
  .item-cell .star{position:absolute; top:2px; right:3px; font-size:8px; color:var(--accent);}
  .item-cell[data-v="50"] .star, .item-cell[data-v="100"] .star{color:rgba(0,0,0,0.45);}

  footer.site{text-align:center; padding:26px; color:var(--text-dim); font-size:11.5px;}

  @media (max-width:760px){
    .block-row{grid-template-columns:1fr;}
    .sector-bars{grid-template-columns:repeat(2,1fr);}
    .house-grid{grid-template-columns:repeat(9,1fr); gap:5px;}
    .house-cell .hn{font-size:11px;}
    .checklist-panel{width:280px; right:-10px;}
    header.site{padding:10px 14px;}
    .brand img{height:36px;}
  }
</style>
</head>

const diagLog = [];
function diag(msg){
  const t = new Date().toLocaleTimeString('pt-BR');
  diagLog.push('['+t+'] ' + msg);
  if(diagLog.length > 200) diagLog.shift();
  const box = document.getElementById('diagBox');
  if(box && box.style.display !== 'none'){
    box.textContent = diagLog.join('\n');
    box.scrollTop = box.scrollHeight;
  }
}
function showStatus(msg, isError){
  const bar = document.getElementById('statusBar');
  if(!bar) return;
  bar.style.display = 'block';
  bar.textContent = msg;
  bar.style.background = isError ? '#4a2f2f' : '#2f3f36';
  bar.style.color = isError ? '#f3d9d4' : '#cfe8db';
  diag((isError ? 'STATUS(erro): ' : 'STATUS: ') + msg);
}
window.addEventListener('error', (e) => {

});
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  showStatus('Erro (promise): ' + (r && (r.message || r.code) ? (r.code ? (r.code+': '+r.message) : r.message) : String(r)), true);

const ITEMS = DATA.items;
const SECTORS = DATA.sectors;

const ITEM_BY_ID = {};
ITEMS.forEach(it => ITEM_BY_ID[it.id] = it);
const SECTOR_BY_ID = {};
SECTORS.forEach(s => SECTOR_BY_ID[s.id] = s);
const BLOCK_BY_HOUSE = {};
BLOCKS.forEach(b => b.houses.forEach(h => BLOCK_BY_HOUSE[h] = b.id));

// ---------- state ----------
// state[houseNum] = { itemId(str): 0|50|100 }
let state = {};

function getHouseItems(h){
  return (state[h] && state[h].items) || {};
}
// Tolerant read: any stored value normalizes to the nearest valid state
// (0/50/100), so leftover/odd data from earlier testing self-heals instead
// of getting the cycle logic stuck.
function normalizeVal(raw){
  const n = Number(raw);
  if(!isFinite(n)) return 0;
  if(n >= 75) return 100;
  if(n >= 25) return 50;
  return 0;
}
function getItemVal(h, itemId){
  const items = getHouseItems(h);
  const raw = items[String(itemId)];
  return normalizeVal(raw === undefined ? 0 : raw);
}

function sectorPct(h, sectorId){
  let sum = 0;
  ITEMS.filter(it => it.sector === sectorId).forEach(it => {
    sum += it.weight * (getItemVal(h, it.id) / 100);
  });
  return sum * 100;
}
function housePct(h){
  const secs = SECTORS.map(s => sectorPct(h, s.id));
  return secs.reduce((a,b)=>a+b,0) / secs.length;
}
function itemHouseFraction(h, itemId){
  return getItemVal(h, itemId) / 100;
}
function itemOverallPct(itemId){
  let sum = 0, n = 0;
  for(let h=1; h<=54; h++){ sum += itemHouseFraction(h, itemId); n++; }
  return (sum/n) * 100;
}
function itemBlockPct(blockId, itemId){
  const block = BLOCKS.find(b=>b.id===blockId);
  let sum = 0;
  block.houses.forEach(h => sum += itemHouseFraction(h, itemId));
  return (sum/block.houses.length) * 100;
}
function blockOverallPct(blockId){
  const block = BLOCKS.find(b=>b.id===blockId);
  let sum = 0;
  block.houses.forEach(h => sum += housePct(h));
  return sum/block.houses.length;
}
function siteOverallPct(){
  let sum=0;
  for(let h=1;h<=54;h++) sum += housePct(h);
  return sum/54;
}

const STORAGE_KEY = 'vivendas_barao_state_v1';

function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    diag('salvo no armazenamento local deste navegador.');
  }catch(e){
    diag('erro ao salvar localmente: ' + (e && e.message ? e.message : e));
  }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.keys(parsed).forEach(h => {
        state[h] = { items: Object.assign({}, (parsed[h] && parsed[h].items) || {}) };
      });
      diag('carregado do armazenamento local. Casas com dados: ' + Object.keys(state).length);
    } else {
      diag('nenhum dado local salvo ainda neste navegador.');
    }
  }catch(e){
    diag('erro ao carregar dados locais: ' + (e && e.message ? e.message : e));
  }
}

// Every change writes straight to Firestore, so both Mariana and her boss
// see the same data (a local copy is also kept as an offline backup).
async function writeHouse(h){
  const items = JSON.parse(JSON.stringify(getHouseItems(h)));
  try{
    await setDoc(doc(fdb, 'casas', 'h'+h), { items });
    diag('Firestore: casa '+h+' salva com sucesso.');
    saveLocal();
  }catch(e){
    diag('Firestore: FALHOU ao salvar casa '+h+' — ' + (e && (e.code||e.message) ? (e.code+' '+e.message) : e));
    showStatus('Não consegui salvar no banco compartilhado agora (ficou só neste navegador por enquanto). Toque em "Atualizar dados" para tentar de novo.', true);
    saveLocal();
  }
}


function cycleVal(v){
  const n = normalizeVal(v);
  if(n === 0) return 50;
  if(n === 50) return 100;
  return 0;
}
function setItemVal(h, itemId, val){
  // Data read from the database arrives frozen — never mutate it in place
  // (that fails silently and leaves the value unchanged). Always build a
  // brand new items object instead.
  const prevItems = (state[h] && state[h].items) || {};
  const nextItems = Object.assign({}, prevItems);
  nextItems[String(itemId)] = val;
  state[h] = { items: nextItems };
}

// ---------- routing ----------
function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  if(!hash) return {page:'home'};
  const parts = hash.split('/');
  if(parts[0] === 'casa') return {page:'casa', id: parseInt(parts[1],10)};
  if(parts[0] === 'item') return {page:'item', id: parseInt(parts[1],10)};
  return {page:'home'};
}

function render(){
  const r = currentRoute();
  const app = document.getElementById('app');
  if(r.page === 'casa' && r.id>=1 && r.id<=54){
    app.innerHTML = renderCasa(r.id);
    bindCasaEvents(r.id);
  } else if(r.page === 'item' && ITEM_BY_ID[r.id]){
    app.innerHTML = renderItemPage(r.id);
    bindItemEvents(r.id);
  } else {
    app.innerHTML = renderHome();
    bindHomeEvents();
  }
}
// Used only for real navigation (a new page/route) — scrolls to the top.
// A checkbox click calls render() directly, staying at the scroll position
// the person was already at.
function navigateRender(){
  render();
  window.scrollTo(0,0);
}

function bindCasaEvents(h){
  if(READONLY) return;
  document.querySelectorAll('.checkbox3').forEach(el => {
    el.addEventListener('click', async () => {
      try{
        const itemId = parseInt(el.getAttribute('data-item'),10);
        const cur = getItemVal(h, itemId);
        const next = cycleVal(cur);
        diag('clique: casa '+h+', item '+itemId+' — '+cur+' -> '+next);
        setItemVal(h, itemId, next);
        render();
        const verify = document.querySelector('.checkbox3[data-item="'+itemId+'"]');
        diag('após render(): elemento encontrado='+(!!verify)+', data-v no DOM='+(verify?verify.getAttribute('data-v'):'N/A')+', cor de fundo='+(verify?getComputedStyle(verify.querySelector('.box-inner')).backgroundColor:'N/A'));

      }catch(err){
        showStatus('Erro ao registrar toque: ' + (err && err.message ? err.message : err), true);
      }
    });
  });

// ---------- data load (one-shot, from this browser's own storage) ----------
// Fetches all house data from Firestore (the shared source of truth).
// Falls back to this browser's local cache if Firestore can't be reached.
async function loadAllData(){
  try{
    const snap = await getDocs(collection(fdb, 'casas'));
    snap.forEach(docSnap => {
      const num = parseInt(docSnap.id.replace('h',''),10);
      if(!num) return;
      const data = docSnap.data();
      if(data) state[num] = { items: Object.assign({}, data.items || {}) };
    });
    diag('Firestore: dados carregados. Casas com dados: ' + Object.keys(state).length);
    saveLocal();
  }catch(e){
    diag('Firestore: FALHOU ao carregar — ' + (e && (e.code||e.message) ? (e.code+' '+e.message) : e) + '. Usando cópia local.');
    loadLocal();
    throw e;
  }
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error((label||'operação')+' demorou demais')), ms))
  ]);
}

    document.querySelector('header.site').insertAdjacentElement('afterend', banner);
  }
  buildChecklistPanel();
  window.addEventListener('hashchange', navigateRender);

  document.getElementById('app').innerHTML = '<div style="padding:80px 20px;text-align:center;color:var(--text-dim);font-size:14px;">Carregando dados salvos…</div>';
  loadLocal(); // instant local cache, in case Firestore is slow — replaced below once it arrives
  try{
    await withTimeout(loadAllData(), 9000, 'Carregamento dos dados');
    render();
    showStatus('Conectado — dados carregados.', false);
    setTimeout(() => { const b=document.getElementById('statusBar'); if(b) b.style.display='none'; }, 1800);
  }catch(e){
    render();
    showStatus('Não deu pra carregar os dados compartilhados agora (' + (e && e.message ? e.message : e) + ') — mostrando a última cópia salva neste navegador. Toque em "Atualizar dados" para tentar de novo.', true);
  }

  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn){
    refreshBtn.addEventListener('click', async () => {
      refreshBtn.textContent = 'Atualizando…';
      diag('botão Atualizar dados clicado.');
      try{
        await loadAllData();
        render();
        diag('Atualização manual concluída.');
      }catch(e){
        diag('Atualização manual ERRO: ' + (e && e.message ? e.message : e));
        showStatus('Erro ao atualizar: ' + (e && e.message ? e.message : e), true);
      }
      refreshBtn.textContent = 'Atualizar dados ↻';
    });
  }

  const diagBtn = document.getElementById('diagBtn');
  const diagBox = document.getElementById('diagBox');
  if(diagBtn && diagBox){
    diagBtn.addEventListener('click', () => {
      const showing = diagBox.style.display !== 'none';
      diagBox.style.display = showing ? 'none' : 'block';
      diagBtn.textContent = showing ? 'Mostrar diagnóstico' : 'Esconder diagnóstico';
      if(!showing){ diagBox.textContent = diagLog.join('\n'); diagBox.scrollTop = diagBox.scrollHeight; }
    });
  }
}
init();
</script>
</body>
</html>
